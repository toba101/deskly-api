name: Deskly mock smoke

on:
  push:
    branches:
      - "feature/**"
  pull_request:

jobs:
  mock-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify mock file exists
        run: |
          ls -R postman/mocks
          test -f postman/mocks/deskly-api/default.js

      - name: Start Deskly mock
        run: |
          PORT=4500 node postman/mocks/deskly-api/default.js > mock.log 2>&1 &
          echo $! > mock.pid

      - name: Wait for mock
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4500/health; then
              echo "Mock is ready"
              exit 0
            fi
            echo "Attempt $i failed"
            sleep 1
          done

          echo "===== MOCK LOG ====="
          cat mock.log || true
          echo "===================="
          exit 1

      - name: Smoke request against mock
        run: |
          curl -sf http://localhost:4500/health

      - name: Stop mock
        if: always()
        run: |
          kill $(cat mock.pid) || true