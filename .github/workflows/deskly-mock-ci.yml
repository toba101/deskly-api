name: Deskly Mock CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  mock-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Verify Postman CLI
        run: postman --version

      - name: Run Postman mock
        run: postman mock run ./postman/mocks/deskly-api/default.js
