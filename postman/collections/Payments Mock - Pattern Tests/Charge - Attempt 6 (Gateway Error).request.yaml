$kind: http-request
method: POST
url: 'http://localhost:4600/charge'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 5000,
      "currency": "usd",
      "source": "tok_visa"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Attempt 6: status is 500", () => pm.expect(pm.response.code).to.equal(500));
      pm.test("Attempt 6: error code is PAYMENT_GATEWAY_ERROR", () => pm.expect(pm.response.json().error).to.equal('PAYMENT_GATEWAY_ERROR'));
      pm.test("Attempt 6: attempt is 6", () => pm.expect(pm.response.json().attempt).to.equal(6));
