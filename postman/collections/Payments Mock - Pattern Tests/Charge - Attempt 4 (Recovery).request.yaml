$kind: http-request
method: POST
url: 'http://localhost:4600/charge'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 5000,
      "currency": "usd",
      "source": "tok_visa"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Attempt 4: status is 200", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("Attempt 4: success is true", () => pm.expect(pm.response.json().success).to.be.true);
      pm.test("Attempt 4: attempt is 4", () => pm.expect(pm.response.json().attempt).to.equal(4));
      pm.test("Attempt 4: recovery note present", () => pm.expect(pm.response.json().note).to.equal('Recovered after gateway error'));
